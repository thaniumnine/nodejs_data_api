services:
  postgres:
    image: postgres:18-alpine
    container_name: thaniumnine-data-postgres
    environment:
      POSTGRES_DB: thaniumnine_data
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d thaniumnine_data"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: thaniumnine-data-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3500:3500"
    command: sh -c "npm run db:migrate && npm run start"

volumes:
  postgres_data:
