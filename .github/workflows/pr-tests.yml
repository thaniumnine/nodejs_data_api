
name: PR Integration Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: '3500'
      DATABASE_URL: postgresql://ci_user:ci_only_password@127.0.0.1:5432/ci_test
      JWT_ACCESS_SECRET: ci-only-dummy-jwt-secret-needs-to-be-32-characters
      ACCESS_TOKEN_TTL_SECONDS: '900'
      REFRESH_TOKEN_TTL_DAYS: '30'
      AUTH_ALLOW_REGISTRATION: 'true'
      CORS_ORIGIN: http://localhost:5173
      ADMIN_EMAIL: admin@thaniumnine.com
      ADMIN_PASSWORD: ci-email-secret
      CI: "true"
      ALLOW_SCHEDULING_TEST_SEED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Initialise PostgreSQL tables
        run: npm run db:migrate

      - name: Create organisation
        run: npm run insert-new:organisation -- simmtronic SIM

      - name: Initialise device types
        run: npm run iterate:deviceType -- SIM

      - name: Create aggregation record tables
        run: npm run create_new_aggregation_record_tables -- SIM

      - name: Seed admin account
        run: npm run seed:admin   
      
      - name: Run E2E COV tests
        run: npm run test:all:cov

      - name: Build application
        run: npm run build
