apiVersion: apps/v1
kind: Deployment
metadata:
  name: thaniumos-api
  labels:
    app: thaniumos-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thaniumos-api
  template:
    metadata:
      labels:
        app: thaniumos-api
    spec:
      containers:
        - name: thaniumos-api
          image: europe-west1-docker.pkg.dev/dev-thaniumos/dev-thaniumos-repo/thaniumos-api:v1.0.1
          ports:
            - containerPort: 3500
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 3500
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3500
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3500
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3500"
            - name: ACCESS_TOKEN_TTL_SECONDS
              value: "900"
            - name: REFRESH_TOKEN_TTL_DAYS
              value: "30"
            - name: AUTH_ALLOW_REGISTRATION
              value: "true"
            - name: CORS_ORIGIN
              value: "http://localhost:5173,http://localhost:3000,https://bim.thaniumos.com/,https://thaniumos.com/"
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: env-secret
                  key: JWT_ACCESS_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: env-secret
                  key: DATABASE_URL

            
            
    