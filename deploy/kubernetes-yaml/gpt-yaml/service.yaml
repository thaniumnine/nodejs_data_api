apiVersion: v1
kind: Service
metadata:
  name: thaniumos-api-service
  namespace: default
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
    cloud.google.com/backend-config: '{"default":"thaniumos-api-backend-config"}'
  labels:
    app: thaniumos-api
spec:
  type: NodePort
  selector:
    app: thaniumos-api
  ports:
    - name: http
      port: 80
      targetPort: 3500
