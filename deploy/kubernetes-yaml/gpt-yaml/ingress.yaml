apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: thaniumos-api-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.global-static-ip-name: "global-api"
    kubernetes.io/ingress.allow-http: "true"
    networking.gke.io/v1beta1.FrontendConfig: "thaniumos-api-config"
  labels:
    app: thaniumos-api
spec:
  tls:
  - secretName: thaniumossecret25
  rules:
  - host: api.thaniumos.com
    http:
      paths:
      - pathType: ImplementationSpecific
        backend:
          service:
            name: thaniumos-api-service
            port:
              number: 80